<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4fb">
<title>BL 한끗 더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4fb; --paper:#fff; --ink:#23212a; --muted:#76717d;
  --line:#e9e3ef; --accent:#8b68b8; --accent-2:#efe7f8; --accent-3:#5f447f;
  --shadow:0 10px 30px rgba(71,52,90,.07); --radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nanum Gothic",system-ui,sans-serif;line-height:1.65;max-width:100%}
button{font:inherit}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:20px 18px 80px}
.brand{font-weight:900;font-size:26px;letter-spacing:-1.2px;margin:2px 0 18px;color:#2b2531}
.hero-btn{width:100%;border:0;border-radius:18px;background:var(--accent);color:white;font-weight:800;font-size:17px;padding:16px 18px;box-shadow:0 8px 22px rgba(139,104,184,.22);cursor:pointer}
.hero-btn:active{transform:translateY(1px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;margin-top:16px;align-items:start;min-width:0;max-width:100%}
.panel{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(6px);min-width:0;max-width:100%}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
.section-title{margin:0;font-size:20px;font-weight:900;letter-spacing:-.7px}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0;max-width:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 16px;min-width:0;max-width:100%;overflow:visible}
.card.wide{grid-column:1/-1}
.label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--accent-3);margin-bottom:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.value{font-size:14.5px;letter-spacing:-.2px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--accent-2);color:var(--accent-3);border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:700}
.actions{display:grid;gap:8px}
.action-btn{width:100%;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);padding:13px 12px;font-weight:800;cursor:pointer}
.action-btn.primary{background:#2f2937;color:#fff;border-color:#2f2937}
.side-title{font-size:14px;font-weight:900;margin:19px 2px 9px}
.recent{display:grid;gap:8px}
.recent-item{border:1px solid var(--line);background:white;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;min-width:0;max-width:100%;overflow:visible}
.recent-item strong{display:block;font-size:12.5px;margin-bottom:3px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.recent-item span{display:block;font-size:11.5px;color:var(--muted);white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.empty{font-size:12px;color:var(--muted);padding:10px 3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#2f2937;color:white;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.site-footer{margin-top:28px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7;padding:0 14px 24px;overflow-wrap:anywhere}
.site-footer .version{margin-left:6px;font-weight:700;color:#8a8490}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{order:2}
}
@media(max-width:640px){
  .wrap{padding:16px 14px 64px;max-width:100%;width:100%}
  .brand{font-size:23px;margin-bottom:14px}
  .hero-btn{position:sticky;top:10px;z-index:5;border-radius:16px;padding:15px}
  .layout{margin-top:12px;gap:12px;width:100%;min-width:0}
  .panel{padding:14px;border-radius:20px;width:100%;min-width:0}
  .section-title{font-size:18px}
  .result-grid{grid-template-columns:minmax(0,1fr);gap:9px;width:100%;min-width:0}
  .card,.card.wide{grid-column:auto;padding:14px 15px;border-radius:16px}
  .value{font-size:14px}
  .side{background:transparent;border:0;box-shadow:none;padding:0}
  .actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .side-title{margin-top:16px}
}
</style>
</head>

      </div>
      <div class="side-title">최근 결과</div>
      <div id="recent" class="recent"></div>
    </aside>
  </div>
</div>
<footer class="site-footer">

  <span class="version">v0.1.3</span>
</footer>

function buildResult(){
  const role=pick(DATA.roles);
  const mutual=role.label==="상호 스팽";
  const topT=sample(DATA.tendencies,2).join(" · ");
  const botT=sample(DATA.tendencies,2).join(" · ");
  const humiliation=sample(DATA.humiliation,Math.random()<.45?2:1).join(" + ");
  const tool1=pick(DATA.tools);
  const tool2=maybe(.3)?pick(DATA.tools.filter(x=>x!==tool1)):null;
  const toolText=tool2?tool1+" → "+tool2:tool1;
  const impact=pick(DATA.impactAreas);
  const posture=pick(DATA.positions);
  const restraint=(posture==="OTK"||posture==="스톡스")?"구속 없음":pick(DATA.restraints);
  const place=pick(DATA.places);
  const object=pick(DATA.objects);
  const result={
    설정:`${pick(DATA.worlds)} · ${pick(DATA.settings)}. ${pick(DATA.timing)}, ${place}. ${pick(DATA.secrecy)}. 관계 단계는 ‘${pick(DATA.stages)}’이며, 둘 사이에는 “${pick(DATA.rules)}”라는 약속이 있다.`,
    관계:pick(DATA.relations),
    상황:`${pick(DATA.situations)} 분위기를 바꾸는 작은 신호는 ‘${pick(DATA.triggers)}’이고, 장면에 ${object}가 놓여 있다.`,
    변수:pick(DATA.variables),
    성향:`공: ${topT} / 수: ${botT} / 스팽 역할: ${role.label}`,
    플레이:`${impact} · ${toolText} · ${posture} · ${pick(DATA.rhythms)} · ${pick(DATA.strengths)} · ${restraint}. 수치 요소는 ‘${humiliation}’. 이번 장면에서 특히 드러나는 약점은 ‘${pick(DATA.weaknesses)}’.`,
    "받는 사람 감정선":pick(DATA.receiverEmotion),
    "하는 사람 감정선":pick(DATA.giverEmotion),
    "음성 반응":pick(DATA.voice)+" "+pick(DATA.aftermath)
  };
  if(mutual){
    result["받는 사람 감정선"]="역할이 오갈 때마다 상대가 방금 자신에게 보인 반응을 그대로 돌려줄지, 일부러 다르게 할지 의식한다. "+result["받는 사람 감정선"];
    result["하는 사람 감정선"]="자기가 받은 감각을 기억한 채 상대의 반응을 새롭게 읽는다. "+result["하는 사람 감정선"];
  }
  return result;
}

const order=["설정","관계","상황","변수","성향","플레이","받는 사람 감정선","하는 사람 감정선","음성 반응"];
let current=null;
let recent=JSON.parse(localStorage.getItem("hankkeutMoreRecent")||"[]");

function render(r){
  current=r;
  const el=document.getElementById("result");
  el.innerHTML=order.map(k=>`
    <section class="card ${["설정","상황","플레이","받는 사람 감정선","하는 사람 감정선","음성 반응"].includes(k)?"wide":""}">
      <div class="label"><span class="dot"></span>${k}</div>
      <div class="value">${escapeHtml(r[k])}</div>
    </section>`).join("");
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function saveRecent(r){
  recent.unshift(r);
  recent=recent.slice(0,5);
  localStorage.setItem("hankkeutMoreRecent",JSON.stringify(recent));
  renderRecent();
}

function renderRecent(){
  const el=document.getElementById("recent");
  if(!recent.length){el.innerHTML='<div class="empty">아직 저장된 결과가 없어.</div>';return}
  el.innerHTML=recent.map((r,i)=>`<button class="recent-item" data-i="${i}"><strong>${escapeHtml(r.관계)} · ${escapeHtml(r.변수)}</strong><span>${escapeHtml(r.상황)}</span></button>`).join("");
  el.querySelectorAll(".recent-item").forEach(b=>b.onclick=()=>{ render(recent[+b.dataset.i]); scrollToResult(); });
}

function scrollToResult(){
  const target=document.querySelector("main.panel");
  const top=target.getBoundingClientRect().top+window.scrollY-74;
  window.scrollTo({top,behavior:"smooth"});
}

function generate(){
  const r=buildResult();
  render(r);
  saveRecent(r);
  window.scrollTo({top:0,behavior:"smooth"});
}

function copyCurrent(){
  if(!current)return;
  const text="BL 한끗 더\n\n"+order.map(k=>`[${k}]\n${current[k]}`).join("\n\n");
  navigator.clipboard.writeText(text).then(()=>toast("결과를 복사했어")).catch(()=>toast("복사에 실패했어"));
}

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),1400);
}

document.getElementById("generate").onclick=generate;
document.getElementById("reroll").onclick=generate;
document.getElementById("copy").onclick=copyCurrent;
const initialResult=buildResult();
render(initialResult);
saveRecent(initialResult);
</script>
