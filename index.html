<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4fb">
<title>BL 한끗 더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4fb; --paper:#fff; --ink:#23212a; --muted:#76717d;
  --line:#e9e3ef; --accent:#8b68b8; --accent-2:#efe7f8; --accent-3:#5f447f;
  --shadow:0 10px 30px rgba(71,52,90,.07); --radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nanum Gothic",system-ui,sans-serif;line-height:1.65;max-width:100%}
button{font:inherit}
.wrap{width:100%;max-width:1500px;margin:0 auto;padding:24px 28px 84px}
.brand{font-weight:900;font-size:26px;letter-spacing:-1.2px;margin:2px 0 14px;color:#2b2531}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tab-btn{border:1px solid var(--line);background:white;color:var(--muted);border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
.tab-btn.active{background:var(--accent-2);border-color:#d9c8ea;color:var(--accent-3)}
.context-note{font-size:12px;color:var(--muted);margin:0 2px 12px;line-height:1.55}
.hero-btn{width:100%;border:0;border-radius:13px;background:var(--accent);color:white;font-weight:800;font-size:17px;padding:16px 18px;box-shadow:0 8px 20px rgba(99,51,174,.18);cursor:pointer}
.hero-btn:active{transform:translateY(1px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 280px;gap:18px;margin-top:18px;align-items:start;min-width:0;max-width:100%}
.panel{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;padding:22px 24px 18px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.side{position:sticky;top:18px}
.side-heading{font-size:18px;font-weight:900;margin:0 2px 8px;letter-spacing:-.5px}
.mode-panel .tabs{grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.side-desc{margin:0 2px 16px;font-size:12px;line-height:1.55;color:var(--muted)}
.mode-panel .hero-btn{margin-top:2px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
.panel-reroll{border:1px solid #ded8ed;background:white;color:var(--accent-3);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.panel-reroll:active{transform:translateY(1px)}
.section-title{margin:0;font-size:24px;font-weight:900;letter-spacing:-.9px}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0;max-width:100%}
.card{background:#fff;border:1px solid #ece8f3;border-radius:13px;padding:14px 15px;min-width:0;max-width:100%;overflow:visible}
.card.wide{grid-column:1/-1}
.label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--accent-3);margin-bottom:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.value{font-size:14.5px;letter-spacing:-.2px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--accent-2);color:var(--accent-3);border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:700}
.side-heading{display:flex;align-items:center;gap:8px}
.side-heading::before{content:"✦";color:var(--accent);font-size:16px}
.actions{display:grid;gap:8px}
.action-btn{width:100%;border:1px solid #d9d0ec;border-radius:12px;background:white;color:var(--ink);padding:13px 10px;font-weight:800;cursor:pointer}
.action-btn.primary{background:#2f2937;color:#fff;border-color:#2f2937}
.side-title{font-size:14px;font-weight:900;margin:19px 2px 9px}
.recent{display:grid;gap:8px}
.recent-item{border:1px solid #eeeaf4;background:white;border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;min-width:0;max-width:100%;overflow:visible}
.recent-item strong{display:block;font-size:12.5px;margin-bottom:3px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.recent-item span{display:block;font-size:11.5px;color:var(--muted);white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.empty{font-size:12px;color:var(--muted);padding:10px 3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#2f2937;color:white;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.site-footer{width:min(1280px,calc(100% - 56px));margin:30px auto 22px;padding:18px 4px 8px;border-top:1px solid #e8e5ef;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7;overflow-wrap:anywhere}
.site-footer .version{margin-left:6px;font-weight:700;color:#8a8490}
@media(min-width:901px) and (max-width:1300px){
  .wrap{max-width:1280px;padding:18px 20px 64px}
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 240px;gap:14px}
  .panel{padding:18px;border-radius:18px}
  .section-title{font-size:22px}
  .result-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .value{font-size:14px}
}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .idea-panel{order:1}
  .scene-panel{order:2}
  .side{order:3;position:static}
}
@media(max-width:640px){
  .wrap{padding:16px 14px 64px;max-width:100%;width:100%}
  .brand{font-size:23px;margin-bottom:14px}
  .hero-btn{position:sticky;top:10px;z-index:5;border-radius:16px;padding:15px}
  .layout{margin-top:12px;gap:12px;width:100%;min-width:0}
  .panel{padding:14px;border-radius:16px;width:100%;min-width:0}
  .section-title{font-size:18px}
  .result-grid{grid-template-columns:minmax(0,1fr);gap:9px;width:100%;min-width:0}
  .card,.card.wide{grid-column:auto;padding:13px 14px;border-radius:12px}
  .value{font-size:14px}
  .side{background:transparent;border:0;box-shadow:none;padding:0;position:static}
  .side-heading{display:none}
  .side-desc{display:none}
  .actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .side-title{margin-top:16px}
}

</style>
</head>

        <h1 class="section-title">오늘의 한끗</h1>

      </div>

    <section class="panel scene-panel">

      <div id="sceneResult" class="result-grid"></div>
    </section>

    <aside class="panel side">

      <div class="actions">
        <button id="copyIdea" class="action-btn primary">오늘의 한끗 복사</button>
        <button id="copyScene" class="action-btn">장면 한끗 복사</button>
        <button id="copyAll" class="action-btn">전체 복사</button>
      </div>
      <div class="side-title">최근 결과</div>
      <div id="recent" class="recent"></div>
    </aside>
  </div>
</div>
<footer class="site-footer">
  <span>© 2026 미녹음. All rights reserved.</span>
  <span class="version">v0.13.1</span>
</footer>
<div id="toast" class="toast">복사했어</div>

function hasBatchim(text){
  const chars=[...String(text)].filter(ch=>ch>="가"&&ch<="힣");
  if(!chars.length)return false;
  return (chars[chars.length-1].charCodeAt(0)-0xAC00)%28!==0;
}
const topic=text=>String(text)+(hasBatchim(text)?"은":"는");
const subject=text=>String(text)+(hasBatchim(text)?"이":"가");
const objectParticle=text=>String(text)+(hasBatchim(text)?"을":"를");
const copulaEnding=text=>hasBatchim(text)?"이다":"다";
const sample=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
const weightedPick=a=>{
  const total=a.reduce((s,x)=>s+(x.weight||1),0);
  let r=Math.random()*total;
  for(const x of a){r-=x.weight||1;if(r<0)return x}
  return a[a.length-1];
};

function relationSituationTags(relation,world){
  const r=canonicalRelation(relation);
  const tags=["general"];
  if(isWorkRelation(relation,world))tags.push("work");
  if(realWorldUpperRole(relation))tags.push("hierarchy");
  if(/친구/.test(relation))tags.push("friend");
  if(/라이벌|선수 × 선수|배우 × 배우/.test(relation))tags.push("rival");
  if(/플레이 파트너/.test(relation))tags.push("partner");
  if(/전 연인|전 플레이 파트너|재회/.test(relation))tags.push("ex","partner");
  if(/룸메이트|동거인/.test(relation))tags.push("cohabit");
  if(/비혈연 형제/.test(relation))tags.push("fakefamily");
  return [...new Set(tags)];
}

function situationStageCompatible(text,stage){
  if(stage==="첫 플레이 전" && /(끝난 뒤|두 번째 날짜|다시 플레이|재개)/.test(text))return false;
  if(["막 연애를 시작한 단계","오래된 연인","권태기"].includes(stage)){
    if(/서로 감정이 없다고|상대가 먼저 마음을 품었다고 착각|좋아한다는 말 대신.*처음으로 감정을 들킨다/.test(text))return false;
  }
  if(stage==="오래된 연인" && /연애와 플레이를 분리하기로 했던 약속이 질투 때문에 처음 흔들린다/.test(text))return false;
  return true;
}

function chooseSituation(group,type,relation,world,stage,role){
  const tags=relationSituationTags(relation,world);
  const hMode=hierarchyMode(relation,role);
  let pool=SITUATION_BANK.filter(s=>{
    if(!s.groups.includes(group))return false;
    if(s.types&&!s.types.includes(type))return false;
    if(s.worlds&&!s.worlds.includes(world))return false;
    if(s.tags&&!s.tags.some(t=>tags.includes(t)))return false;
    if(s.hierarchyModes&&!s.hierarchyModes.includes(hMode))return false;
    if(!situationStageCompatible(s.text,stage))return false;
    return true;
  });
  if(!pool.length)pool=SITUATION_BANK.filter(s=>s.groups.includes(group)&&s.tags&&s.tags.includes("general")&&!s.worlds&&!s.types&&situationStageCompatible(s.text,stage));
  if(!pool.length)pool=SITUATION_BANK.filter(s=>s.groups.includes(group)&&situationStageCompatible(s.text,stage));
  if(!pool.length)pool=SITUATION_BANK.filter(s=>s.tags&&s.tags.includes("general")&&!s.worlds&&!s.types);
  return weightedPick(pool.map(s=>({...s,weight:s.weight||1}))).text;
}

function chooseVariable(group,type,relation,world,stage,situation,role){
  const tags=relationSituationTags(relation,world);
  const hMode=hierarchyMode(relation,role);
  let pool=VARIABLE_BANK.filter(v=>{
    if(v.groups&&!v.groups.includes(group))return false;
    if(v.types&&!v.types.includes(type))return false;
    if(v.worlds&&!v.worlds.includes(world))return false;
    if(v.stages&&!v.stages.includes(stage))return false;
    if(v.tags&&!v.tags.some(t=>tags.includes(t)))return false;
    if(v.hierarchyModes&&!v.hierarchyModes.includes(hMode))return false;
    if(v.conflicts&&v.conflicts.some(word=>situation.includes(word)))return false;
    const vt=v.text;
    if(/다른 파트너/.test(situation)&&/다른 파트너/.test(vt))return false;
    if(/다음 약속/.test(situation)&&/다음 약속/.test(vt))return false;
    if(/연락/.test(situation)&&/연락/.test(vt))return false;
    if(/호칭.*일상|일상.*호칭/.test(situation)&&/호칭.*일상|일상.*호칭/.test(vt))return false;
    if(/감각.*예민|자극도 다르게/.test(situation)&&/감각.*예민|같은 자극에도 반응/.test(vt))return false;
    return true;
  });

  // 범용 변수만 남아도 최소 후보 수를 확보하되 세계관 전용 변수는 다른 세계관으로 새지 않게 한다.
  if(pool.length<5){
    pool=VARIABLE_BANK.filter(v=>
      (!v.groups||v.groups.includes(group)) &&
      !v.types && !v.worlds && !v.tags && !v.hierarchyModes &&
      (!v.stages||v.stages.includes(stage)) &&
      !(v.conflicts&&v.conflicts.some(word=>situation.includes(word)))
    );
  }
  return pick(pool);
}

function isWorkRelation(relation,world=""){

  const alwaysFormal=new Set([
    "상사 × 부하","팀장 × 팀원","대표 × 실장","대표 × 비서",

    "가이드 × 에스퍼","훈련 담당자 × 에스퍼","센터 동료",
    "길드 선배 × 후배","훈련 담당자 × 능력자","생활지원 담당자 × 성인 수인"
  ]);
  if(alwaysFormal.has(r))return true;
  if(r==="라이벌 동료")return world!=="현대 일상물";
  if(r==="배우 × 배우")return world==="현대 연예계물";
  if(r==="선수 × 선수")return world==="현대 스포츠물";

  return false;
}

function chooseBase(world,profile,relation,role){
  const base=isWorkRelation(relation,world)?pick(profile.bases):pick(NONWORK_BASES[world]||profile.bases);
  if(base==="집안과 회사에서는 위계가 분명하지만 사적인 통제 관계는 다르다"){
    const upper=realWorldUpperRole(relation);
    if(!upper)return "가문과 회사의 공적인 역할과 둘만의 플레이 규칙을 분리해 유지한다";
    const lower=upper==="공"?"수":"공";
    if(role&&role.giver===upper){
      return `가문과 회사에서는 ${subject(upper)} ${lower}보다 높은 위치에 있고, 사적으로도 ${subject(upper)} 통제권을 갖지만 공적인 지시와 플레이 규칙은 철저히 구분한다`;
    }
    return `가문과 회사에서는 ${subject(upper)} ${lower}보다 높은 위치에 있지만, 둘만 있을 때는 ${subject(lower)} 통제권을 갖는다`;
  }
  return base;
}

const TENDENCY_POOLS={
  dom:["사디스트","브랫 테이머","서비스 돔","리거"],
  sub:["마조히스트","브랫","서비스 섭","로프 버니"]
};

function makeTendencies(role,relation){
  const topIsGiver=role.giver==="공";
  const giverExtra=pick(TENDENCY_POOLS.dom);
  const receiverExtra=pick(TENDENCY_POOLS.sub);
  return {
    top:topIsGiver?"스팽커 · 돔 · "+giverExtra:"스팽키 · 섭 · "+receiverExtra,
    bottom:topIsGiver?"스팽키 · 섭 · "+receiverExtra:"스팽커 · 돔 · "+giverExtra
  };
}
function chooseHumiliations(impact,type,count){
  const bilateral=/전체|좌우 번갈아/.test(impact),formal=(type==="work"||type==="hotel"),mirrorAvailable=["home","hotel","playroom"].includes(type);
  let pool=HUMS.filter(h=>!h.need||(h.need==="mirror"&&mirrorAvailable)||(h.need==="bilateral"&&bilateral)||(h.need==="formal"&&formal));
  // 거울 수치 요소는 체감 중복이 커서 일반 수치 요소보다 낮은 확률로 후보에 남긴다.
  pool=pool.filter(h=>h.need!=="mirror"||maybe(.24));
  const chosen=sample(pool,count);
  const forcedObject=chosen.some(h=>h.need==="mirror")?"거울":null;
  return{texts:chosen.map(h=>h.text),forcedObject};
}

function chooseSMPlay(type){
  const pool=SM_PLAYS.filter(x=>x.types.includes(type));
  return pick(pool.length?pool:SM_PLAYS).text;
}
function chooseSexScene(type,world){
  let basePool=SEX_SCENES;
  if(type==="work"||type==="institution"||type==="fantasy"){
    basePool=SEX_SCENES.filter(x=>!x.includes("거울 앞"));
  }
  const hardPool=HARDCORE_SEX_SCENES.filter(x=>(!x.types||x.types.includes(type))&&(!x.worlds||x.worlds.includes(world)));
  if(hardPool.length&&maybe(.62))return pick(hardPool).text;
  return pick(basePool);
}

function chooseSceneObject(type,forcedName,ctx={}){
  const text=[ctx.smPlay,ctx.sexScene,...(ctx.humTexts||[]),ctx.weak].filter(Boolean).join(" ");
  const speechNeeded=/(질문에는 대답|호칭과 대답|대답만 쓰게|준비됐다고 직접 말|특정 호칭을 유지|칭찬을 들을 때마다 짧게 대답|왜 맞는지 자기 입으로|몇 대 받을지 스스로 정한 뒤 다시 말|끝난 뒤.*직접 말|먼저 원하는 걸 말|원하는 속도나 분위기를 직접 말|스스로 끝났다는 대답)/.test(text);
  const visualNeeded=/(거울 앞에서|거울로 직접 확인|눈이 마주치면)/.test(text);
  const bedPlace=/침대|호텔|숙소|레지던스|펜트하우스|별장|오피스텔/.test(ctx.place||"");
  let pool=OBJECTS.filter(o=>{
    if(!o.types.includes(type))return false;
    if(o.name==="볼 개그"&&speechNeeded)return false;
    if(o.name==="안대"&&visualNeeded)return false;
    if(o.name==="스프레더 바"&&ctx.posture==="OTK")return false;
    if(o.name==="침대 구속 스트랩"&&!bedPlace)return false;
    return true;
  });
  if(forcedName){
    const forced=pool.find(o=>o.name===forcedName);
    if(forced)return forced;
  }
  const finalPool=pool.length?pool:OBJECTS.filter(o=>o.types.includes(type));
  // 강제 거울이 아닌 일반 오브제 선택에서는 거울 자체도 낮은 가중치를 준다.
  return weightedPick(finalPool.map(o=>({...o,weight:o.name==="거울"?.35:1})));
}

 const world=pick(DATA.worlds),profile=PROFILES[world],[place,type]=pick(profile.places),relation=chooseRelationForProfile(profile),stage=chooseStageForRelation(relation),group=stageGroup(stage),arrangement=chooseArrangementForRelation(relation),role=weightedPick(DATA.roles),tendencies=makeTendencies(role,relation),situation=chooseSituation(group,type,relation,world,stage,role),variable=chooseVariable(group,type,relation,world,stage,situation,role),weak=pick(WEAKS.filter(w=>w[0]!==variable.key)),impact=pick(DATA.impactAreas),hum=chooseHumiliations(impact,type,Math.random()<.45?2:1),smPlay=chooseSMPlay(type),sexScene=chooseSexScene(type,world),posture=choosePosition(type),sceneObject=chooseSceneObject(type,hum.forcedObject,{smPlay,sexScene,humTexts:hum.texts,weak:weak[1],posture,place}),restraint=chooseRestraint(posture,type),tool1=chooseTool(type),tool2=maybe(.28)?chooseTool(type):null,toolText=(tool2&&tool2!==tool1)?`${tool1} → ${tool2}`:tool1,rhythm=pick(DATA.rhythms),strength=pick(DATA.strengths),rule=chooseRule(relation,world),giver=role.giver,receiver=role.receiver,receiverEmotion=pick(DATA.receiverEmotion),giverEmotion=pick(DATA.giverEmotion),aftermath=pick(DATA.aftermath);

function chooseScenePlayTransition(type,objectName){
  let pool=PLAY_TRANSITIONS.filter(x=>x.types.includes(type));
  if(objectName==="볼 개그"){
    pool=pool.filter(x=>!/말과 시선|상대가 먼저 말|대답 방식|직접 말|말로 확인/.test(x.text));
  }
  if(objectName==="안대"){
    pool=pool.filter(x=>!/말과 시선만으로/.test(x.text));
  }
  return pick(pool.length?pool:PLAY_TRANSITIONS.filter(x=>x.types.includes(type))).text;
}
function chooseSceneSexTransition(type,world,objectName){
  let hardPool=HARDCORE_SEX_TRANSITIONS.filter(x=>(!x.types||x.types.includes(type))&&(!x.worlds||x.worlds.includes(world)));
  let pool=SEX_TRANSITIONS.filter(x=>x.types.includes(type));
  if(objectName==="볼 개그"){
    hardPool=hardPool.filter(x=>!/대사|직접 말/.test(x.text));
    pool=pool.filter(x=>!/요청|묻도록|확인/.test(x.text));
  }
  if(hardPool.length&&maybe(.58))return pick(hardPool).text;
  return pick(pool.length?pool:SEX_TRANSITIONS.filter(x=>x.types.includes(type))).text;
}
function chooseRelationTransition(ctx,sceneGroup){
  const tags=relationSituationTags(ctx.relation,ctx.world);
  let pool=RELATION_TRANSITIONS.filter(x=>{
    if(x.groups&&!x.groups.includes(sceneGroup))return false;
    if(x.stages&&!x.stages.includes(ctx.stage))return false;
    if(x.tags&&!x.tags.some(t=>tags.includes(t)))return false;
    return true;
  });
  if(!pool.length)pool=RELATION_TRANSITIONS.filter(x=>(!x.groups||x.groups.includes(sceneGroup))&&!x.tags&&!x.stages);
  return pick(pool.length?pool:RELATION_TRANSITIONS).text;
}
function getSceneContext(r){const ctx=(r&&r._ctx)||{};return {world:ctx.world||"",type:ctx.type||"home",relation:(r&&r.관계)||ctx.relation||"플레이 파트너",stage:ctx.stage||"",hierarchyMode:ctx.hierarchyMode||null,objectName:(r&&r.오브제?String(r.오브제).split(" · ")[0]:ctx.objectName||""),situation:(r&&r.상황)||"",variable:(r&&r.변수)||"",impact:ctx.impact||"",toolText:ctx.toolText||"",posture:ctx.posture||"",rhythm:ctx.rhythm||"",strength:ctx.strength||"",restraint:ctx.restraint||"",smPlay:ctx.smPlay||"",sexScene:ctx.sexScene||"",rule:ctx.rule||""};}
function buildSceneResult(base){
  const ctx=getSceneContext(base);
  const posture=ctx.posture||choosePosition(ctx.type);
  const restraint=ctx.restraint||chooseRestraint(posture,ctx.type);
  const toolText=ctx.toolText||chooseTool(ctx.type);
  const rhythm=ctx.rhythm||pick(DATA.rhythms);
  const strength=ctx.strength||pick(DATA.strengths);
  let smPool=SM_PLAYS.filter(x=>x.types.includes(ctx.type)&&x.text!==ctx.smPlay);
  if(ctx.objectName==="볼 개그"){
    smPool=smPool.filter(x=>!/대답|말을 꺼내|직접 말|호칭/.test(x.text));
  }
  if(ctx.objectName==="안대"){
    smPool=smPool.filter(x=>!/거울 앞/.test(x.text));
  }
  const smChoices=[ctx.smPlay||chooseSMPlay(ctx.type)];
  if(maybe(.42)&&smPool.length)smChoices.push(pick(smPool).text);
  const sceneGroup=ctx.stage?stageGroup(ctx.stage):"ongoing";
  const startPool=sceneGroup==="first"?FIRST_SCENE_STARTS:sceneGroup==="contract"?CONTRACT_SCENE_STARTS:sceneGroup==="reunion"?REUNION_SCENE_STARTS:sceneGroup==="ending"?ENDING_SCENE_STARTS:SCENE_STARTS;
  const start=pick(startPool);
  const end=pick(SCENE_ENDINGS);
  const emotionPool=isWorkRelation(ctx.relation,ctx.world)?SCENE_EMOTION_SHIFTS.concat(WORK_EMOTION_SHIFTS):SCENE_EMOTION_SHIFTS;
  let pointPool=isWorkRelation(ctx.relation,ctx.world)?ONE_MORE_POINTS.concat(WORK_ONE_MORE_POINTS):ONE_MORE_POINTS;
  if(ctx.hierarchyMode==="inverted")pointPool=pointPool.concat(INVERTED_HIERARCHY_ONE_MORE_POINTS);
  const why=ctx.situation?ctx.situation.replace(/\s*분위기를 바꾸는 작은 신호는[\s\S]*$/,""):start;
  const sexBase=ctx.sexScene||chooseSexScene(ctx.type,ctx.world);
  const playTransition=chooseScenePlayTransition(ctx.type,ctx.objectName);
  const sexTransition=chooseSceneSexTransition(ctx.type,ctx.world,ctx.objectName);
  const relationTransition=chooseRelationTransition(ctx,sceneGroup);
  const ruleCarry=ctx.rule?" 이때 첫 탭에서 정한 ‘"+ctx.rule+"’ 규칙은 그대로 유지한다.":"";
  return {
    "현재 장면":why+" "+start+".",
    "스팽 진행":(ctx.impact?ctx.impact+" · ":"")+posture+" → "+toolText+" → "+rhythm+" → "+strength+" → "+end+". "+restraint+".",
    "플레이 변주":smChoices.join(" + ")+". "+playTransition,
    "섹스 연결":sexBase+ruleCarry+" "+sexTransition,
    "감정 변화":pick(emotionPool)+" 현재 관계는 ‘"+ctx.relation+"’이므로 이 변화가 둘의 기존 관계와 사적인 관계 사이의 온도 차로 이어진다.",
    "관계 전환":relationTransition,
    "한 끗":pick(pointPool)+"."
  };
}

function escapeHtml(s){return String(s??"").replace(/[&<>"\']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function saveRecent(r){recent.unshift(r);recent=recent.slice(0,5);localStorage.setItem("hankkeutMoreRecent",JSON.stringify(recent));renderRecent();}
function renderRecent(){
  const el=document.getElementById("recent");
  if(!recent.length){el.innerHTML='<div class="empty">아직 저장된 결과가 없어.</div>';return}
  el.innerHTML=recent.map((r,i)=>`<button class="recent-item" data-i="${i}"><strong>${escapeHtml(r.관계)} · ${escapeHtml(r.변수)}</strong><span>${escapeHtml(r.상황)}</span></button>`).join("");
  el.querySelectorAll(".recent-item").forEach(b=>b.onclick=()=>{
    current=recent[+b.dataset.i];
    currentScene=buildSceneResult(current);
    renderIdea(current);
    renderScene();
    scrollToResults();
  });
}

function copyBlock(title,r,keys){
  if(!r)return Promise.reject();
  const text=title+"\n\n"+keys.map(k=>`[${k}]\n${r[k]}`).join("\n\n");
  return navigator.clipboard.writeText(text);
}

function copyScene(){
  if(!currentScene&&current)currentScene=buildSceneResult(current);
  copyBlock("BL 한끗 더 · 장면 한끗",currentScene,sceneOrder).then(()=>toast("장면 한끗을 복사했어")).catch(()=>toast("복사에 실패했어"));
}
function copyAll(){
  if(!current)return;
  if(!currentScene)currentScene=buildSceneResult(current);
  const ideaText="BL 한끗 더 · 오늘의 한끗\n\n"+order.map(k=>`[${k}]\n${current[k]}`).join("\n\n");
  const sceneText="BL 한끗 더 · 장면 한끗\n\n"+sceneOrder.map(k=>`[${k}]\n${currentScene[k]}`).join("\n\n");
  navigator.clipboard.writeText(ideaText+"\n\n--------------------\n\n"+sceneText)
    .then(()=>toast("두 결과를 모두 복사했어"))
    .catch(()=>toast("복사에 실패했어"));
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1400);}
document.getElementById("generateIdea").onclick=generateIdea;
document.getElementById("generateScene").onclick=generateScene;
document.getElementById("copyIdea").onclick=copyIdea;
document.getElementById("copyScene").onclick=copyScene;
document.getElementById("copyAll").onclick=copyAll;
const initialResult=buildResult();
renderIdea(initialResult);
currentScene=buildSceneResult(initialResult);
renderScene();
saveRecent(initialResult);
</script>
</body>
