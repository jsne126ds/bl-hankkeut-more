<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4fb">
<title>BL 한끗 더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4fb; --paper:#fff; --ink:#23212a; --muted:#76717d;
  --line:#e9e3ef; --accent:#8b68b8; --accent-2:#efe7f8; --accent-3:#5f447f;
  --shadow:0 10px 30px rgba(71,52,90,.07); --radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nanum Gothic",system-ui,sans-serif;line-height:1.65;max-width:100%}
button{font:inherit}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:20px 18px 80px}
.brand{font-weight:900;font-size:26px;letter-spacing:-1.2px;margin:2px 0 14px;color:#2b2531}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tab-btn{border:1px solid var(--line);background:white;color:var(--muted);border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer}
.tab-btn.active{background:var(--accent-2);border-color:#d9c8ea;color:var(--accent-3)}
.context-note{font-size:12px;color:var(--muted);margin:0 2px 12px;line-height:1.55}
.hero-btn{width:100%;border:0;border-radius:18px;background:var(--accent);color:white;font-weight:800;font-size:17px;padding:16px 18px;box-shadow:0 8px 22px rgba(139,104,184,.22);cursor:pointer}
.hero-btn:active{transform:translateY(1px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;margin-top:16px;align-items:start;min-width:0;max-width:100%}
.panel{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(6px);min-width:0;max-width:100%}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
.section-title{margin:0;font-size:20px;font-weight:900;letter-spacing:-.7px}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0;max-width:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 16px;min-width:0;max-width:100%;overflow:visible}
.card.wide{grid-column:1/-1}
.label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--accent-3);margin-bottom:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.value{font-size:14.5px;letter-spacing:-.2px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--accent-2);color:var(--accent-3);border-radius:999px;padding:4px 8px;font-size:11.5px;font-weight:700}
.actions{display:grid;gap:8px}
.action-btn{width:100%;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);padding:13px 12px;font-weight:800;cursor:pointer}
.action-btn.primary{background:#2f2937;color:#fff;border-color:#2f2937}
.side-title{font-size:14px;font-weight:900;margin:19px 2px 9px}
.recent{display:grid;gap:8px}
.recent-item{border:1px solid var(--line);background:white;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;min-width:0;max-width:100%;overflow:visible}
.recent-item strong{display:block;font-size:12.5px;margin-bottom:3px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.recent-item span{display:block;font-size:11.5px;color:var(--muted);white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.empty{font-size:12px;color:var(--muted);padding:10px 3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#2f2937;color:white;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.site-footer{margin-top:28px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7;padding:0 14px 24px;overflow-wrap:anywhere}
.site-footer .version{margin-left:6px;font-weight:700;color:#8a8490}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{order:2}
}
@media(max-width:640px){
  .wrap{padding:16px 14px 64px;max-width:100%;width:100%}
  .brand{font-size:23px;margin-bottom:14px}
  .hero-btn{position:sticky;top:10px;z-index:5;border-radius:16px;padding:15px}
  .layout{margin-top:12px;gap:12px;width:100%;min-width:0}
  .panel{padding:14px;border-radius:20px;width:100%;min-width:0}
  .section-title{font-size:18px}
  .result-grid{grid-template-columns:minmax(0,1fr);gap:9px;width:100%;min-width:0}
  .card,.card.wide{grid-column:auto;padding:14px 15px;border-radius:16px}
  .value{font-size:14px}
  .side{background:transparent;border:0;box-shadow:none;padding:0}
  .actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .side-title{margin-top:16px}
}
</style>
</head>

      </div>
      <div class="side-title">최근 결과</div>
      <div id="recent" class="recent"></div>
    </aside>
  </div>
</div>

  const start=pick(SCENE_STARTS);
  const end=pick(SCENE_ENDINGS);
  const emotionPool=isWorkRelation(ctx.relation)?SCENE_EMOTION_SHIFTS.concat(WORK_EMOTION_SHIFTS):SCENE_EMOTION_SHIFTS;
  const pointPool=isWorkRelation(ctx.relation)?ONE_MORE_POINTS.concat(WORK_ONE_MORE_POINTS):ONE_MORE_POINTS;
  const why=ctx.situation?ctx.situation.replace(/\s*분위기를 바꾸는 작은 신호는[\s\S]*$/,""):start;
  const sexBase=ctx.sexScene||chooseSexScene(ctx.type);
  const ruleCarry=ctx.rule?" 이때 첫 탭에서 정한 ‘"+ctx.rule+"’ 규칙은 그대로 유지한다.":"";
  return {
    "현재 장면":why+" "+start+".",
    "스팽 진행":(ctx.impact?ctx.impact+" · ":"")+posture+" → "+toolText+" → "+rhythm+" → "+strength+" → "+end+". "+restraint+".",
    "SM 추가":smChoices.join(" + ")+".",
    "섹스 연결":sexBase+ruleCarry,
    "감정 변화":pick(emotionPool)+" 현재 관계는 ‘"+ctx.relation+"’이므로 이 변화가 둘의 기존 관계와 사적인 관계 사이의 온도 차로 이어진다.",
    "한 끗":pick(pointPool)+"."
  };
}
const sceneOrder=["현재 장면","스팽 진행","SM 추가","섹스 연결","감정 변화","한 끗"];
let current=null;
let currentScene=null;
let activeTab="idea";
let recent=JSON.parse(localStorage.getItem("hankkeutMoreRecent")||"[]");
function renderCards(r,keys){const el=document.getElementById("result");el.innerHTML=keys.map(k=>`<section class="card ${["설정","상황","플레이","받는 사람 감정선","하는 사람 감정선","음성 반응","현재 장면","스팽 진행","SM 추가","섹스 연결","감정 변화","한 끗"].includes(k)?"wide":""}"><div class="label"><span class="dot"></span>${k}</div><div class="value">${escapeHtml(r[k])}</div></section>`).join("");}
function render(r){current=r;renderCards(r,order);}
function renderScene(force=false){if(!current)return;if(force||!currentScene)currentScene=buildSceneResult(current);renderCards(currentScene,sceneOrder);}
function escapeHtml(s){return String(s??"").replace(/[&<>"\']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#39;"}[m]))}
function saveRecent(r){recent.unshift(r);recent=recent.slice(0,5);localStorage.setItem("hankkeutMoreRecent",JSON.stringify(recent));renderRecent();}
function renderRecent(){const el=document.getElementById("recent");if(!recent.length){el.innerHTML='<div class="empty">아직 저장된 결과가 없어.</div>';return}el.innerHTML=recent.map((r,i)=>`<button class="recent-item" data-i="${i}"><strong>${escapeHtml(r.관계)} · ${escapeHtml(r.변수)}</strong><span>${escapeHtml(r.상황)}</span></button>`).join("");el.querySelectorAll(".recent-item").forEach(b=>b.onclick=()=>{current=recent[+b.dataset.i];currentScene=null;activeTab==="scene"?renderScene():render(current);scrollToResult();});}
function scrollToResult(){const target=document.querySelector("main.panel"),top=target.getBoundingClientRect().top+window.scrollY-74;window.scrollTo({top,behavior:"smooth"});}
function setTab(tab){activeTab=tab;const idea=tab==="idea";document.getElementById("ideaTab").classList.toggle("active",idea);document.getElementById("sceneTab").classList.toggle("active",!idea);document.getElementById("ideaTab").setAttribute("aria-selected",String(idea));document.getElementById("sceneTab").setAttribute("aria-selected",String(!idea));document.querySelector(".section-title").textContent=idea?"오늘의 한 끗":"장면 한끗";document.getElementById("generate").textContent=idea?"한끗 더 ✦":"장면 한끗 더 ✦";document.getElementById("contextNote").textContent=idea?"소재를 먼저 뽑으면 장면 한끗이 이 설정을 이어서 확장해.":"현재 소재의 설정·성향·관계·상황을 유지한 채 장면만 확장해.";idea?render(current):renderScene();}
function generate(){if(activeTab==="scene"){renderScene(true);window.scrollTo({top:0,behavior:"smooth"});return}const r=buildResult();render(r);currentScene=null;saveRecent(r);window.scrollTo({top:0,behavior:"smooth"});}
function copyCurrent(){const isScene=activeTab==="scene",r=isScene?currentScene:current;if(!r)return;const keys=isScene?sceneOrder:order,title=isScene?"BL 한끗 더 · 장면 한끗":"BL 한끗 더 · 소재 한끗",text=title+"\n\n"+keys.map(k=>`[${k}]\n${r[k]}`).join("\n\n");navigator.clipboard.writeText(text).then(()=>toast("결과를 복사했어")).catch(()=>toast("복사에 실패했어"));}
function copyAll(){
  if(!current)return;
  if(!currentScene)currentScene=buildSceneResult(current);
  const ideaText="BL 한끗 더 · 소재 한끗\n\n"+order.map(k=>`[${k}]\n${current[k]}`).join("\n\n");
  const sceneText="BL 한끗 더 · 장면 한끗\n\n"+sceneOrder.map(k=>`[${k}]\n${currentScene[k]}`).join("\n\n");
  navigator.clipboard.writeText(ideaText+"\n\n--------------------\n\n"+sceneText)
    .then(()=>toast("두 탭 결과를 모두 복사했어"))
    .catch(()=>toast("복사에 실패했어"));
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1400);}
document.getElementById("ideaTab").onclick=()=>setTab("idea");
document.getElementById("sceneTab").onclick=()=>setTab("scene");
document.getElementById("generate").onclick=generate;
document.getElementById("copy").onclick=copyCurrent;
document.getElementById("copyAll").onclick=copyAll;
const initialResult=buildResult();render(initialResult);saveRecent(initialResult);
</script>
</body>
</html>
